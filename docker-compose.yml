services:
  web:
    image: ghcr.io/crediblemark-official/novella:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novella-web
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "${HOST_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-novella_super_secret_auth_key_2026_at_least_32_chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://novella.id}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-https://novella.id,https://buku.novella.id,https://panel.novella.id}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - UPLOADS_DIR=/app/uploads
      - FRONTEND_DIST_DIR=/app/apps/frontend/dist
      - KATALOG_DIST_DIR=/app/apps/katalog/dist
      - PANEL_DIST_DIR=/app/apps/panel/dist
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-novella-manuscripts}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - IMAGEKIT_PUBLIC_KEY=${IMAGEKIT_PUBLIC_KEY:-}
      - IMAGEKIT_PRIVATE_KEY=${IMAGEKIT_PRIVATE_KEY:-}
    volumes:
      - novella_uploads:/app/uploads

volumes:
  novella_uploads:
    name: novella_uploads
